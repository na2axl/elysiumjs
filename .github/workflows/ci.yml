name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Early stage: fast checks, no services
jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo cache
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: bun run typecheck

      - name: Core runs outside Bun
        run: |
          bun run --cwd @elysiumjs/olympus check:runtime
          bun run --cwd @elysiumjs/workers check:runtime

      - name: Lint
        run: bun run lint

      - name: Portability
        run: |
          bun run test:scripts
          bun run check:portability

  # The conformance scenarios, on each runtime: Bun, Node.js (Vitest), workerd (Vitest in the
  # Workers runtime), and workerd again with each scenario compiled ahead of time as a deployed
  # Worker is, without code generation from strings.
  conformance:
    name: Conformance (${{ matrix.lane }})
    needs: quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lane: [bun, node, workerd, workerd-aot]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: actions/setup-node@v4
        if: matrix.lane != 'bun'
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every lane imports the packages through their built `dist`.
      - name: Build
        run: bun run build

      - name: Compile the scenarios ahead of time
        if: matrix.lane == 'workerd-aot'
        working-directory: conformance
        run: bun scripts/build-aot.ts

      # Vitest is called directly in the Node.js and workerd lanes: their `test:*` scripts rebuild
      # through `pretest:*`, which the step above already did.
      - name: Run the conformance suite
        working-directory: conformance
        run: ${{ matrix.lane == 'bun' && 'bun run test' || format('bunx vitest run -c vitest.{0}.config.ts', matrix.lane) }}

  # Late stage: build + test, needs services
  test:
    name: Build & Test
    needs: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo cache
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Services resolve in a minified build
        run: bun run --cwd @elysiumjs/olympus check:minified

      - name: Compiles ahead of time for Workers
        run: bun run --cwd @elysiumjs/workers check:aot

      - name: Runs in wrangler dev
        run: bun run --cwd @elysiumjs/workers check:wrangler

      - name: Test
        run: bun run test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: "**/coverage/**/lcov.info"
          token: ${{ secrets.CODECOV_TOKEN }}
